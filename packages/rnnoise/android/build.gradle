group 'com.wearemobilefirst.rnnoise'
version '1.0'

// Vendored plugin: the Android Gradle Plugin and Kotlin Gradle Plugin come
// from the app's root build (android/settings.gradle.kts), so this file pins
// neither. It follows the same rule as the upstream plugins that support AGP
// 9: apply kotlin-android only while the app opts out of AGP's built-in
// Kotlin (android.builtInKotlin=false in android/gradle.properties). Once the
// app turns built-in Kotlin on, this module compiles with it unchanged.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
def builtInKotlinProperty = project.findProperty('android.builtInKotlin') ?: rootProject.findProperty('android.builtInKotlin')
def useBuiltInKotlin = agpMajor >= 9 && (builtInKotlinProperty == null ? true : builtInKotlinProperty.toString().toBoolean())

apply plugin: 'com.android.library'
if (!useBuiltInKotlin) {
    apply plugin: 'kotlin-android'
}

android {
    namespace 'com.wearemobilefirst.rnnoise'
    // Same SDK and NDK as the app (Flutter's defaults), so the native library
    // is built by the exact toolchain the app ships with instead of a second,
    // older NDK that had to be installed only for this module.
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 24

        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
}

// Built-in Kotlin and kotlin-android both register this extension.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
