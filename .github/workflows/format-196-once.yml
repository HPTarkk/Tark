name: Format 196 Once

on:
  push:
    branches:
      - fix/196-room-first-auto-transport

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/196-room-first-auto-transport
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format changed Dart files
        run: |
          dart format \
            lib/feature/room/domain/service/room_transport_planner.dart \
            lib/feature/room/presentation/widget/selected_room_lobby.dart \
            test/room_transport_policy_contract_test.dart
      - name: Commit formatter output and remove this workflow
        run: |
          rm .github/workflows/format-196-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format #196 room-first changes"
          git push origin HEAD:fix/196-room-first-auto-transport
