name: Apply #48 Wi-Fi capability patch

on:
  push:
    branches:
      - fix/48-wifi-capability-heartbeat-production-v3

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/48-wifi-capability-heartbeat-production-v3
      - name: Apply exact source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/feature/transfer/data/repository/wifi_transfer_repository_impl.dart')
          s = p.read_text()

          def once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              s = s.replace(old, new, 1)

          once(
              "import '../../domain/entity/session_role.dart';\nimport '../../domain/entity/transport_stats.dart';",
              "import '../../domain/entity/session_role.dart';\nimport '../../domain/entity/transport_capability_observation.dart';\nimport '../../domain/entity/transport_stats.dart';",
              'observation entity import',
          )
          once(
              "import '../../domain/repository/wifi_transfer_repository.dart';",
              "import '../../domain/repository/transport_capability_observation_source.dart';\nimport '../../domain/repository/wifi_transfer_repository.dart';",
              'observation source import',
          )
          once(
              "import '../codec/opus_audio_codec.dart';\nimport '../codec/waki_packet_codec.dart';",
              "import '../codec/opus_audio_codec.dart';\nimport '../codec/transport_capability_control_codec.dart';\nimport '../codec/transport_capability_heartbeat_runtime.dart';\nimport '../codec/waki_packet_codec.dart';",
              'capability codec imports',
          )
          once(
              'class WifiTransferRepositoryImpl implements WifiTransferRepository {',
              'class WifiTransferRepositoryImpl\n    implements WifiTransferRepository, TransportCapabilityObservationSource {',
              'class interfaces',
          )
          once(
              "  late final _codec = WakiPacketCodec(_identity.id, _epoch, _membership);\n",
              "  late final _codec = WakiPacketCodec(_identity.id, _epoch, _membership);\n\n  /// #48 keeps capability evidence on the existing one-second unicast heartbeat.\n  /// The runtime appends the bounded mixed-version-safe tail, and only exposes\n  /// remote evidence after the caller proves a Pong matches a ping we sent.\n  late final _transportCapabilityHeartbeat = TransportCapabilityHeartbeatRuntime(\n    codec: TransportCapabilityControlCodec(_codec),\n  );\n\n  @override\n  Stream<TransportCapabilityObservation> get transportCapabilityObservations =>\n      _transportCapabilityHeartbeat.transportCapabilityObservations;\n",
              'heartbeat field',
          )
          once(
              "    _connectionController.close();\n    _codec.release();",
              "    _connectionController.close();\n    unawaited(_transportCapabilityHeartbeat.dispose());\n    _codec.release();",
              'heartbeat disposal',
          )
          once(
              "              if (WakiPacketCodec.isControl(dg.data[0])) {\n                final control = _codec.decodeControl(\n                  dg.data,\n                  dg.address.address,\n                );\n                if (control != null) {\n                  _rememberPeer(dg.address.address);\n                  _handleControl(control, dg.address.address);\n                }\n                continue;\n              }",
              "              if (WakiPacketCodec.isControl(dg.data[0])) {\n                final control = _transportCapabilityHeartbeat.decodeControl(\n                  dg.data,\n                  dg.address.address,\n                );\n                if (control != null) {\n                  _rememberPeer(dg.address.address);\n                  await _handleControl(control, dg.address.address, myGen);\n                }\n                continue;\n              }",
              'control receive path',
          )
          once(
              "  Timer? _pingTimer;\n  int _pingToken = 0;",
              "  Timer? _pingTimer;\n  int _pingToken = 0;\n\n  /// A MethodChannel capability snapshot can span a heartbeat tick. Do not\n  /// overlap reads or let an older generation send after stop/rebind.\n  bool _pingInFlight = false;",
              'ping inflight state',
          )
          once(
              "      _pingPeers();",
              "      if (!_pingInFlight) unawaited(_pingPeers(myGen));",
              'ping timer call',
          )

          old_ping = '''  void _pingPeers() {\n    final now = DateTime.now();\n    final targets = _peers.keys.toList(growable: false);\n    for (final address in targets) {\n      final senderId = _senderAtAddress[address];\n      final rx = senderId == null ? null : _rxBySender[senderId];\n      final token = ++_pingToken;\n      final packet = _codec.encodePing(\n        token: token,\n        lastTxSeq: _audioSeq,\n        lastRxSeq: rx?.lastSeq ?? 0,\n        audioRxPackets: rx?.count ?? 0,\n      );\n      if (_trySend(packet, InternetAddress(address))) {\n        _pings.sent(address, token, now);\n      }\n    }\n\n    // Expire the loss estimates of peers who have gone. Before reading the\n    // worst below, because the worst is exactly what a departed peer would\n    // otherwise go on being: a rider who drops off the back of the group at\n    // 40 % loss would hold the encoder at its lowest bitrate for everyone still\n    // talking, for the rest of the session.\n    _loss.retain(_currentlyHeardSenders());\n    // Same reasoning for capability: a peer who dropped off must not go on\n    // holding (or, once a higher profile is reachable, blocking) the mutual\n    // format for everyone still here.\n    _capabilities.retain(_currentlyHeardSenders());\n    _syncFormatProfile();\n    _mediaCapabilities.retain(_currentlyHeardSenders());\n    _syncMediaFormatProfile();\n    _syncMediaQuality();\n\n    // Retune the encoder for the link we just measured. On this tick rather\n    // than per frame because that is the cadence a new measurement arrives at,\n    // and the codec ignores an unchanged tuning anyway. The ladder itself\n    // follows the negotiated profile — HD's is re-derived, not the legacy\n    // tiers scaled up, see [OpusTuner.hd].\n    _codec.applyTuning(\n      OpusTuner.forProfile(_negotiatedFormat).tune(\n        AudioLinkConditions(\n          lossFraction: _loss.worstLossFraction,\n          rtt: _lastRtt,\n        ),\n      ),\n    );\n    _updateMediaTuning();\n\n    // Peers that have gone silent on unicast while still being heard. Recorded\n    // as a flag the send path can read for free.\n    final unconfirmed = _pings.unconfirmedAmong(targets, now);\n    final wasUnconfirmed = _unicastUnconfirmed;\n    _unicastUnconfirmed = unconfirmed.isNotEmpty;\n    if (_unicastUnconfirmed != wasUnconfirmed) {\n      Logger.diagnostic(\n        _unicastUnconfirmed\n            ? 'wifi: $unconfirmed heard but not answering unicast pings — '\n                  'audio is going back on the broadcast leg for them'\n            : 'wifi: every heard peer is answering unicast again — '\n                  'audio back to unicast only',\n      );\n    }\n  }'''

          new_ping = '''  Future<void> _pingPeers(int myGen) async {\n    if (_pingInFlight) return;\n    _pingInFlight = true;\n    try {\n      final targets = _peers.keys.toList(growable: false);\n      for (final address in targets) {\n        if (_generation != myGen) return;\n        final senderId = _senderAtAddress[address];\n        final rx = senderId == null ? null : _rxBySender[senderId];\n        final token = ++_pingToken;\n        final packet = await _transportCapabilityHeartbeat.encodePing(\n          token: token,\n          lastTxSeq: _audioSeq,\n          lastRxSeq: rx?.lastSeq ?? 0,\n          audioRxPackets: rx?.count ?? 0,\n        );\n        if (_generation != myGen) return;\n        final sentAt = DateTime.now();\n        if (_trySend(packet, InternetAddress(address))) {\n          _pings.sent(address, token, sentAt);\n        }\n      }\n\n      if (_generation != myGen) return;\n      final now = DateTime.now();\n      // Expire the loss estimates of peers who have gone. Before reading the\n      // worst below, because the worst is exactly what a departed peer would\n      // otherwise go on being: a rider who drops off the back of the group at\n      // 40 % loss would hold the encoder at its lowest bitrate for everyone still\n      // talking, for the rest of the session.\n      _loss.retain(_currentlyHeardSenders());\n      // Same reasoning for capability: a peer who dropped off must not go on\n      // holding (or, once a higher profile is reachable, blocking) the mutual\n      // format for everyone still here.\n      _capabilities.retain(_currentlyHeardSenders());\n      _syncFormatProfile();\n      _mediaCapabilities.retain(_currentlyHeardSenders());\n      _syncMediaFormatProfile();\n      _syncMediaQuality();\n\n      // Retune the encoder for the link we just measured. On this tick rather\n      // than per frame because that is the cadence a new measurement arrives at,\n      // and the codec ignores an unchanged tuning anyway. The ladder itself\n      // follows the negotiated profile — HD's is re-derived, not the legacy\n      // tiers scaled up, see [OpusTuner.hd].\n      _codec.applyTuning(\n        OpusTuner.forProfile(_negotiatedFormat).tune(\n          AudioLinkConditions(\n            lossFraction: _loss.worstLossFraction,\n            rtt: _lastRtt,\n          ),\n        ),\n      );\n      _updateMediaTuning();\n\n      // Peers that have gone silent on unicast while still being heard. Recorded\n      // as a flag the send path can read for free.\n      final unconfirmed = _pings.unconfirmedAmong(targets, now);\n      final wasUnconfirmed = _unicastUnconfirmed;\n      _unicastUnconfirmed = unconfirmed.isNotEmpty;\n      if (_unicastUnconfirmed != wasUnconfirmed) {\n        Logger.diagnostic(\n          _unicastUnconfirmed\n              ? 'wifi: $unconfirmed heard but not answering unicast pings — '\n                    'audio is going back on the broadcast leg for them'\n              : 'wifi: every heard peer is answering unicast again — '\n                    'audio back to unicast only',\n        );\n      }\n    } finally {\n      _pingInFlight = false;\n    }\n  }'''
          once(old_ping, new_ping, 'ping method')

          old_control = '''  /// Answers a ping on the same unicast path it arrived by, and records a pong.\n  void _handleControl(ControlPacket packet, String fromAddress) {\n    switch (packet) {\n      case PingPacket():\n        final rx = _rxBySender[packet.senderId];\n        _trySend(\n          _codec.encodePong(\n            token: packet.token,\n            lastTxSeq: _audioSeq,\n            lastRxSeq: rx?.lastSeq ?? 0,\n            audioRxPackets: rx?.count ?? 0,\n          ),\n          InternetAddress(fromAddress),\n        );\n      case PongPacket():\n        final rtt = _pings.pong(fromAddress, packet.token, DateTime.now());\n        if (rtt != null) _lastRtt = rtt;\n        // The counters this pong carries are the only measurement of loss in\n        // the direction our voice travels — see [PeerLossTracker]. They were\n        // already on the wire from P0; this is what finally reads them.\n        _loss.sample(\n          packet.senderId,\n          ourSentCount: _audioSeq,\n          theirReceivedCount: packet.audioRxPackets,\n        );\n    }\n  }'''

          new_control = '''  /// Answers a ping on the same unicast path it arrived by, and records a pong.\n  ///\n  /// #48 capability evidence is admitted only after [PeerPingTracker] proves\n  /// this exact address/token pair answers a ping we sent. Decoding an inbound\n  /// control tail by itself never becomes Room planning authority.\n  Future<void> _handleControl(\n    DecodedTransportCapabilityControl decoded,\n    String fromAddress,\n    int myGen,\n  ) async {\n    final packet = decoded.packet;\n    switch (packet) {\n      case PingPacket():\n        final rx = _rxBySender[packet.senderId];\n        final response = await _transportCapabilityHeartbeat.encodePong(\n          token: packet.token,\n          lastTxSeq: _audioSeq,\n          lastRxSeq: rx?.lastSeq ?? 0,\n          audioRxPackets: rx?.count ?? 0,\n        );\n        if (_generation != myGen) return;\n        _trySend(response, InternetAddress(fromAddress));\n      case PongPacket():\n        final observedAt = DateTime.now();\n        final rtt = _pings.pong(fromAddress, packet.token, observedAt);\n        if (rtt != null) {\n          _lastRtt = rtt;\n          _transportCapabilityHeartbeat.observeMatchedPong(\n            decoded: decoded,\n            peerKey: packet.senderId,\n            observedAt: observedAt,\n          );\n        }\n        // The counters this pong carries are the only measurement of loss in\n        // the direction our voice travels — see [PeerLossTracker]. They were\n        // already on the wire from P0; this is what finally reads them.\n        _loss.sample(\n          packet.senderId,\n          ourSentCount: _audioSeq,\n          theirReceivedCount: packet.audioRxPackets,\n        );\n    }\n  }'''
          once(old_control, new_control, 'control handler')

          p.write_text(s)

          test = Path('test/wifi_transport_capability_observation_wiring_test.dart')
          test.write_text('''import 'package:flutter_test/flutter_test.dart';\nimport 'package:tark/core/identity/channel_membership.dart';\nimport 'package:tark/core/identity/device_identity.dart';\nimport 'package:tark/core/identity/session_epoch.dart';\nimport 'package:tark/feature/transfer/data/repository/wifi_transfer_repository_impl.dart';\nimport 'package:tark/feature/transfer/domain/entity/session_role.dart';\nimport 'package:tark/feature/transfer/domain/repository/transport_capability_observation_source.dart';\nimport 'package:tark/feature/transfer/domain/service/session_role_store.dart';\n\nvoid main() {\n  test('wifi exposes capability source without fabricating peer evidence', () async {\n    final repository = WifiTransferRepositoryImpl(\n      const DeviceIdentity.withId('0123456789ab'),\n      SessionEpoch.startingAt(7),\n      _RoleStore(),\n      ChannelMembership(),\n    );\n\n    expect(repository, isA<TransportCapabilityObservationSource>());\n    var observed = false;\n    final subscription = repository.transportCapabilityObservations.listen((_) {\n      observed = true;\n    });\n    await Future<void>.delayed(Duration.zero);\n\n    expect(observed, isFalse);\n\n    await subscription.cancel();\n    repository.dispose();\n  });\n}\n\nfinal class _RoleStore implements SessionRoleStore {\n  SessionRole? _role;\n\n  @override\n  SessionRole? get role => _role;\n\n  @override\n  void setRole(SessionRole role) => _role = role;\n\n  @override\n  void clear() => _role = null;\n}\n''')
          PY
          dart format lib/feature/transfer/data/repository/wifi_transfer_repository_impl.dart test/wifi_transport_capability_observation_wiring_test.dart
          git diff --check
      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/patch-48-wifi-capability-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/feature/transfer/data/repository/wifi_transfer_repository_impl.dart test/wifi_transport_capability_observation_wiring_test.dart .github/workflows/patch-48-wifi-capability-v3.yml
          git commit -m "transfer: wire verified capability heartbeat into live wifi (#48)"
          git push origin HEAD:fix/48-wifi-capability-heartbeat-production-v3
