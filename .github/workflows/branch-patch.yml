name: Apply live proof production wiring patch

on:
  push:
    branches: [fix/49-live-proof-production-wiring]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/49-live-proof-production-wiring
          fetch-depth: 0
      - name: Patch Wi-Fi live proof wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/feature/transfer/data/repository/wifi_transfer_repository_impl.dart')
          text = path.read_text()

          replacements = [
              (
                  "import '../../domain/entity/transport_capability_observation.dart';\nimport '../../domain/entity/transport_stats.dart';",
                  "import '../../domain/entity/transport_capability_observation.dart';\nimport '../../domain/entity/transport_route_proof_observation.dart';\nimport '../../domain/entity/transport_stats.dart';",
              ),
              (
                  "import '../../domain/repository/transport_capability_observation_source.dart';\nimport '../../domain/repository/wifi_transfer_repository.dart';",
                  "import '../../domain/repository/transport_capability_observation_source.dart';\nimport '../../domain/repository/transport_route_proof_exchange.dart';\nimport '../../domain/repository/wifi_transfer_repository.dart';",
              ),
              (
                  "class WifiTransferRepositoryImpl\n    implements WifiTransferRepository, TransportCapabilityObservationSource {",
                  "class WifiTransferRepositoryImpl\n    implements\n        WifiTransferRepository,\n        TransportCapabilityObservationSource,\n        TransportRouteProofExchange {",
              ),
              (
                  "  @override\n  Stream<TransportCapabilityObservation> get transportCapabilityObservations =>\n      _transportCapabilityHeartbeat.transportCapabilityObservations;\n",
                  "  @override\n  Stream<TransportCapabilityObservation> get transportCapabilityObservations =>\n      _transportCapabilityHeartbeat.transportCapabilityObservations;\n\n  @override\n  Stream<TransportRouteProofObservation> get routeProofObservations =>\n      _transportCapabilityHeartbeat.routeProofObservations;\n\n  @override\n  void setRouteProofProvider(TransportRouteProofProvider? provider) {\n    _transportCapabilityHeartbeat.setRouteProofProvider(provider);\n  }\n",
              ),
              (
                  "          audioRxPackets: rx?.count ?? 0,\n        );\n        if (_generation != myGen) return;\n        _trySend(response, InternetAddress(fromAddress));",
                  "          audioRxPackets: rx?.count ?? 0,\n          // The responder signs the challenger's join epoch echoed by Ping.\n          // This is authority-bearing proof scope, not transport identity.\n          challengeEpoch: packet.sessionEpoch,\n        );\n        if (_generation != myGen) return;\n        _trySend(response, InternetAddress(fromAddress));",
              ),
              (
                  "          _transportCapabilityHeartbeat.observeMatchedPong(\n            decoded: decoded,\n            peerKey: packet.senderId,\n            observedAt: observedAt,\n          );",
                  "          _transportCapabilityHeartbeat.observeMatchedPong(\n            decoded: decoded,\n            // PeerPingTracker matched this token against the exact unicast\n            // source route. Never substitute payload-controlled senderId here.\n            peerKey: fromAddress,\n            observedAt: observedAt,\n            challengeEpoch: _epoch.value,\n          );",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git diff --check
          git rm .github/workflows/branch-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/feature/transfer/data/repository/wifi_transfer_repository_impl.dart
          git commit -m "fix(transfer): expose matched live route proof exchange (#49)"
          git push origin HEAD:fix/49-live-proof-production-wiring
