name: Backend

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: go-vet-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tark
          POSTGRES_PASSWORD: tark
          POSTGRES_DB: tark_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tark -d tark_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: modules are untampered
        run: go mod verify
      - name: test
        env:
          TARK_TEST_DATABASE_URL: postgres://tark:tark@localhost:5432/tark_test?sslmode=disable
        run: go test -race -p 1 -count=1 ./...
      - name: known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -show verbose ./...

  docker:
    name: image-builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: build the image
        run: docker build -t tarkd:ci backend
