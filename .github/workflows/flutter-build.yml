name: Tark beta quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tark-beta-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format-analyze-test-protocol
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify generated localizations
        run: flutter gen-l10n

      - name: Check Dart formatting for changed files
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$PR_BASE_SHA"
          if [ -z "$base" ]; then
            base="$PUSH_BEFORE_SHA"
          fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base="HEAD^"
          fi
          mapfile -t dart_files < <(git diff --diff-filter=ACMR --name-only "$base" HEAD -- '*.dart')
          if [ "${#dart_files[@]}" -eq 0 ]; then
            echo "No changed Dart files to format-check."
            exit 0
          fi
          printf 'Format gate files:\n%s\n' "${dart_files[*]}"
          dart format --output=none --set-exit-if-changed "${dart_files[@]}"

      - name: Analyze
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Run Tark log analyzer tests
        run: python3 scripts/test_decode_tark_log.py

      - name: Verify website localization output
        run: node scripts/build-website-i18n.mjs --check

      - name: Protocol compatibility tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t protocol_tests < <(find test -type f \( -iname '*packet*test.dart' -o -iname '*protocol*test.dart' -o -iname '*codec*compat*test.dart' -o -iname '*mixed*version*test.dart' \) | sort)
          if [ "${#protocol_tests[@]}" -eq 0 ]; then
            echo "No protocol compatibility tests were found."
            exit 1
          fi
          printf 'Protocol gate files:\n%s\n' "${protocol_tests[*]}"
          flutter test "${protocol_tests[@]}"

      - name: Android debug compile check
        run: flutter build apk --debug --dart-define=BUILD_CHANNEL=ci --dart-define=GIT_COMMIT=${{ github.sha }}

      - name: Git diff check
        run: git diff --check
