name: Tark beta quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tark-beta-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format-analyze-test-protocol
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARK_REQUIRE_NATIVE_TESTS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      # .metadata pins Tark's project baseline to Flutter 3.41.9 / Dart 3.11.5.
      # The committed lockfile has since been touched by a newer SDK and carries
      # SDK-pinned transitive versions that 3.41.9 cannot reproduce byte-for-byte,
      # so CI resolves from the committed pubspec constraints instead of silently
      # testing a different Flutter formatter/runtime than the project baseline.
      - name: Get dependencies
        run: flutter pub get

      - name: Verify generated localizations
        run: flutter gen-l10n

      - name: Check Dart formatting for changed files
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$PR_BASE_SHA"
          if [ -z "$base" ]; then
            base="$PUSH_BEFORE_SHA"
          fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base="HEAD^"
          fi
          mapfile -t dart_files < <(git diff --diff-filter=ACMR --name-only "$base" HEAD -- '*.dart')
          if [ "${#dart_files[@]}" -eq 0 ]; then
            echo "No changed Dart files to format-check."
            exit 0
          fi
          printf 'Format gate files:\n%s\n' "${dart_files[*]}"
          dart format "${dart_files[@]}"
          if ! git diff --exit-code -- "${dart_files[@]}"; then
            echo "Dart formatting changed committed files. Commit the formatter output."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Build and test native realtime core
        shell: bash
        run: |
          set -euo pipefail
          cxx="${CXX:-g++}"
          mkdir -p build/native-tests
          for test in double_ring_buffer voice_playout realtime_dsp spectral_suppressor; do
            "$cxx" -std=c++17 -O2 -pthread "packages/audio_io/test/${test}_test.cpp" -o "build/native-tests/$test"
            "build/native-tests/$test"
          done
          for test in realtime_dsp spectral_suppressor; do
            "$cxx" -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer "packages/audio_io/test/${test}_test.cpp" -o "build/native-tests/${test}-sanitized"
            "build/native-tests/${test}-sanitized"
          done
          # Keep the allocation fault injector local to each fixture on ELF.
          "$cxx" -std=c++17 -O2 -shared -fPIC -Wl,-Bsymbolic-functions packages/audio_io/test/native_dsp_test_api.cpp -o build/native-tests/libnative_dsp_test_api.so
          "$cxx" -std=c++17 -O2 -shared -fPIC -Wl,-Bsymbolic-functions -DAUDIO_IO_TEST_OMIT_SPECTRAL_RESET packages/audio_io/test/native_dsp_test_api.cpp -o build/native-tests/libnative_dsp_incomplete_test_api.so
          cmake -S packages/rnnoise/test -B build/rnnoise_native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/rnnoise_native --parallel 2
          ctest --test-dir build/rnnoise_native --output-on-failure
          echo "AUDIO_IO_TEST_LIBRARY=$PWD/build/native-tests/libnative_dsp_test_api.so" >> "$GITHUB_ENV"
          echo "AUDIO_IO_TEST_INCOMPLETE_LIBRARY=$PWD/build/native-tests/libnative_dsp_incomplete_test_api.so" >> "$GITHUB_ENV"
          echo "RNNOISE_LIBRARY_PATH=$PWD/build/rnnoise_native/librnnoise_host.so" >> "$GITHUB_ENV"
          echo "RNNOISE_LEGACY_LIBRARY_PATH=$PWD/build/rnnoise_native/librnnoise_legacy_host.so" >> "$GITHUB_ENV"

      - name: Run Flutter tests with coverage
        run: flutter test --coverage

      - name: Enforce Dart coverage
        run: |
          python3 scripts/check_coverage.py coverage/lcov.info --minimum 65
          python3 scripts/check_coverage.py coverage/lcov.info --minimum 90 --include '*/feature/audio/domain/resampler.dart' --include '*/feature/audio/domain/spectral_noise_suppressor.dart' --include '*/feature/audio/domain/rnnoise_suppressor.dart'

      - name: Save coverage report
        uses: actions/upload-artifact@v7
        with:
          name: dart-coverage
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Run Tark log analyzer tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Verify website localization output
        run: node scripts/build-website-i18n.mjs --check

      # The legal documents have three consumers generated from one source:
      # the English pages, the Persian pages, and the copy bundled into the
      # APK. A commit that edits website/legal/*.json without rebuilding
      # would ship an app whose privacy policy differs from the published
      # one, which is the exact failure this whole arrangement exists to
      # prevent.
      - name: Verify legal documents and app assets are in step
        run: node scripts/build-legal-pages.mjs --check

      - name: Verify website routes, SEO and local assets
        run: node scripts/check-website.mjs

      - name: Protocol compatibility tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t protocol_tests < <(find test -type f \( -iname '*packet*test.dart' -o -iname '*protocol*test.dart' -o -iname '*codec*compat*test.dart' -o -iname '*mixed*version*test.dart' \) | sort)
          if [ "${#protocol_tests[@]}" -eq 0 ]; then
            echo "No protocol compatibility tests were found."
            exit 1
          fi
          printf 'Protocol gate files:\n%s\n' "${protocol_tests[*]}"
          flutter test "${protocol_tests[@]}"

      - name: Web guest compile check
        run: flutter build web --target lib/main_guest.dart

      - name: Android debug compile check
        shell: bash
        run: |
          set -euo pipefail
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          flutter build apk --debug \
            --dart-define=BUILD_CHANNEL=ci \
            --dart-define=GIT_COMMIT=${{ github.sha }} \
            --dart-define=GIT_DIRTY=false \
            --dart-define=BUILD_TIMESTAMP="$built_at"

      - name: Git diff check
        run: git diff --check
