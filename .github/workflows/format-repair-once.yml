name: One-shot Dart format repair

on:
  push:
    branches:
      - fix/format-main-20260903

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/format-main-20260903

      - name: Setup Flutter used by beta gate
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Format files touched by R0-R22 merge
        shell: bash
        run: |
          set -euo pipefail
          base='0354fe7b6a0c432ad91fef4566b4b5d42b216c7b'
          mapfile -t dart_files < <(git diff --diff-filter=ACMR --name-only "$base" HEAD -- '*.dart')
          if [ "${#dart_files[@]}" -eq 0 ]; then
            echo 'No Dart files to format.'
          else
            printf 'Formatting %s changed Dart files\n' "${#dart_files[@]}"
            dart format "${dart_files[@]}"
          fi

      - name: Remove one-shot workflow and commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/format-repair-once.yml
          if git diff --quiet --cached && git diff --quiet; then
            echo 'Nothing changed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: apply Dart formatter after R0-R22 merge'
          git push origin HEAD:fix/format-main-20260903
