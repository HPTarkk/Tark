name: Smartwatch branch checks

on:
  push:
    branches:
      - feature/smartwatch-room-control
  pull_request:
    paths:
      - "android/wear/**"
      - "android/app/**"
      - "ios/TarkWatch/**"
      - "ios/Runner/AppDelegate.swift"
      - "lib/app/my_app.dart"
      - "lib/core/home_widget/widget_control_channel.dart"
      - "pubspec.yaml"
      - ".github/workflows/smartwatch-build.yml"
  workflow_dispatch:

jobs:
  wear-and-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Configure Android Flutter SDK path
        shell: bash
        run: |
          FLUTTER_ROOT="$(dirname "$(dirname "$(command -v flutter)")")"
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Check Dart formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/app/my_app.dart
          lib/core/home_widget/widget_control_channel.dart

      - name: Flutter analyze
        run: flutter analyze

      - name: Build Galaxy Watch debug APK
        id: wear_build
        continue-on-error: true
        working-directory: android/wear
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --info 2>&1 | tee wear-build.log

      - name: Upload Wear build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tark-wear-build-diagnostics
          path: android/wear/wear-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Build handheld debug APK
        id: phone_build
        if: steps.wear_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee phone-build.log

      - name: Upload handheld build diagnostics
        if: always() && steps.wear_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tark-handheld-build-diagnostics
          path: phone-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload Galaxy Watch APK
        if: steps.wear_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tark-galaxy-watch-debug
          path: android/wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload handheld APK
        if: steps.phone_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tark-handheld-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Fail when an Android build failed
        if: steps.wear_build.outcome == 'failure' || steps.phone_build.outcome == 'failure'
        run: |
          echo "An Android build failed; inspect the diagnostics artifacts."
          exit 1
