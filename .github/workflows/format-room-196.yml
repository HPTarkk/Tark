name: Format Room 196 once

on:
  push:
    branches:
      - fix/196-room-first-auto-transport
    paths:
      - .github/workflows/format-room-196.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/196-room-first-auto-transport
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Prepare package context
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Format changed Dart files
        run: |
          dart format \
            lib/feature/room/domain/service/room_transport_planner.dart \
            lib/feature/room/presentation/widget/selected_room_lobby.dart \
            test/pre_live_one_scan_room_bootstrap_contract_test.dart \
            test/room_entry_link_gate_test.dart \
            test/room_transport_policy_contract_test.dart \
            test/selected_room_lobby_invite_test.dart \
            test/selected_room_lobby_link_test.dart

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/format-room-196.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format #196 room-first changes"
          git push origin HEAD:fix/196-room-first-auto-transport
