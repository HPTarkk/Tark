name: FormatPR148
on:
  push:
    branches: [fix/48-wifi-capability-heartbeat-production-v3]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/48-wifi-capability-heartbeat-production-v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Format and commit
        shell: bash
        run: |
          dart format lib/feature/transfer/data/repository/wifi_transfer_repository_impl.dart test/wifi_transport_capability_observation_wiring_test.dart
          rm .github/workflows/format-pr148.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: format #48 wifi capability wiring'
          git push origin HEAD:fix/48-wifi-capability-heartbeat-production-v3
