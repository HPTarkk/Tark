name: Apply48Patch
on:
  push:
    branches: [fix/48-wifi-capability-heartbeat-production-v3]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/48-wifi-capability-heartbeat-production-v3
      - name: Patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch48.py
          python3 /tmp/patch48.py
          git diff --check
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/patch-48-wifi-capability-v3.yml .github/workflows/patch-48-wifi-capability-v3b.yml .github/workflows/patch-48-wifi-capability-v3c.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'transfer: wire verified capability heartbeat into live wifi (#48)'
          git push origin HEAD:fix/48-wifi-capability-heartbeat-production-v3
