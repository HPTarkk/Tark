name: tark
description: "Tark — an off-grid, push-to-talk voice walkie-talkie. Phones talk directly over Wi-Fi, Bluetooth, or a hosted hotspot, with no internet and no server."
publish_to: 'none'
version: 1.0.8-beta.3+10

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audio_io:
    path: packages/audio_io
  rnnoise:
    path: packages/rnnoise
  beat_transitions:
    path: packages/beat_transitions
  equatable: ^2.0.8
  dartz: ^0.10.1
  injectable: ^3.0.0
  get_it: ^9.2.1
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  go_router: ^17.2.3
  permission_handler: ^12.0.1
  shared_preferences: ^2.3.0
  package_info_plus: ^9.0.1
  # 0.1.1 currently ships a Kotlin Gradle script that does not apply the
  # Kotlin Android plugin before using compilerOptions. Pin the last compatible
  # release until the upstream build script is corrected.
  flutter_blue_classic: 0.1.0
  opus_dart: ^3.0.1
  opus_flutter: ^3.0.3
  bluetooth_low_energy: ^6.2.1
  flutter_webrtc: ^1.5.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  archive: ^4.0.9
  audioplayers: ^6.1.0
  home_widget: ^0.9.3
  adtrace_sdk_flutter: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator:
  build_runner:
  flutter_gen:
  flutter_gen_runner:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#0B0E11"
    theme_color: "#F5853F"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/sfx/
    - assets/image/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Light.ttf
          weight: 300
        - asset: assets/fonts/Vazirmatn-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Vazirmatn-Thin.ttf
          weight: 100
