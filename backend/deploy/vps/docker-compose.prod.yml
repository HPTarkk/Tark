# Production stack for one server: PostgreSQL + the API + Caddy (automatic HTTPS).
#
# Always run with the env file next to it:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d
# (deploy.ps1 does this for you.)
#
# Only Caddy publishes ports (80 and 443). The database and the API are
# reachable from inside the stack only.
name: tark

services:
  db:
    image: ${TARK_POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: tark
      POSTGRES_DB: tark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tark -d tark"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  api:
    image: ${TARK_IMAGE:?set TARK_IMAGE in .env.production (deploy.ps1 does it)}
    restart: unless-stopped
    env_file: .env.production
    environment:
      # The database is on the private compose network, so plaintext inside it
      # is fine (a single-label host such as "db" passes the production check).
      TARK_DATABASE_URL: postgres://tark:${POSTGRES_PASSWORD}@db:5432/tark?sslmode=disable
      TARK_HTTP_ADDR: ":8080"
      # Caddy is the only thing that talks to the API, and it puts the real
      # client address in X-Forwarded-For. Trust that header from this network only.
      TARK_CLIENT_IP_HEADER: X-Forwarded-For
      TARK_TRUSTED_PROXIES: 172.28.0.0/24
      # Daily encrypted backups land here (kept 14 days by default). Fetch
      # copies to your computer with fetch-backups.ps1.
      TARK_BACKUP_DIR: /backups
      # The admin panel listens here, inside the stack only; Caddy serves it
      # at TARK_ADMIN_DOMAIN.
      TARK_ADMIN_ADDR: ":8081"
      # The API log is also kept here, one file per day, for 30 days
      # (Docker itself keeps only the last 50 MB). bash remote.sh log-days.
      TARK_LOG_DIR: /logs
      # Alert when the HTTPS certificates Caddy serves are close to expiry.
      TARK_ALERT_TLS_ADDR: caddy:443
    volumes:
      - backups:/backups
      - logs:/logs
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The image has its own HEALTHCHECK (tarkd healthcheck).
    networks: [internal]
    logging: *logging

  caddy:
    image: ${TARK_CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TARK_DOMAIN: ${TARK_DOMAIN:?set TARK_DOMAIN in .env.production}
      TARK_ADMIN_DOMAIN: ${TARK_ADMIN_DOMAIN:?set TARK_ADMIN_DOMAIN in .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [internal]
    logging: *logging

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  backups:
  logs:
  caddy_data:
  caddy_config:
