openapi: 3.1.0
info:
  title: Tark API
  version: 1.0.0
  description: |
    The contract between the Tark app and the Tark backend (Go, PostgreSQL,
    hosted on ArvanCloud). Both sides are written against this file; neither
    one is the source of truth on its own.

    It covers accounts and sign-in (email + password with a verification
    code or link, Google Sign-In with account linking, password reset and
    change, sessions, and the email-change flow the app does not offer yet),
    the profile, and the subscription surface the app's offline-first
    entitlement logic depends on.

    Conventions
    - Every endpoint is HTTPS only and versioned under /v1.
    - Errors use one shape (Problem). `code` is stable and machine-readable;
      `message` is a sentence for people in the request's language; the app
      never shows `detail` to people.
    - Language: every response that carries people-facing text (error
      messages, plan titles) follows the `Accept-Language` header. English
      (`en`) and Persian (`fa`) exist; anything else gets English. The
      chosen language comes back in `Content-Language`.
    - Writes that the app may retry carry an `Idempotency-Key` header. The
      same key with the same body returns the first response again; the same
      key with a different body is refused with 422 `idempotency_mismatch`.
    - Times are Unix epoch milliseconds (int64), always from the server clock.
servers:
  # Relative: resolved against wherever this document is served from, so the
  # interactive docs at /docs call the same server they were opened on (a
  # developer's machine never reaches production by accident).
  - url: /v1
    description: The server serving this document
  - url: https://api.tarkk.ir/v1
    description: Production
security:
  - accessToken: []
tags:
  - name: Sign-up and sign-in
    description: Email + password sign-up with a code or link, password login, and Google Sign-In with account linking.
  - name: Sessions
    description: Rotating refresh tokens and sign-out.
  - name: Password
    description: Reset (forgot password) and change.
  - name: Email change
    description: Verified change of the account's email address.
  - name: Profile
    description: The signed-in person's name and avatar.
  - name: Account
    description: Account deletion.
  - name: Subscription
    description: Cafe Bazaar purchase verification and the signed entitlement.

paths:
  # ---- Accounts and sign-in ----------------------------------------------
  #
  # None of these reveal whether an email has an account: register and
  # forgot-password answer the same either way, and every login failure is
  # the same `invalid_credentials`.
  #
  # Sign-in is Android and iOS only. Every call may carry X-Tark-Platform
  # and X-Tark-Install-Key; they are stored on the session.
  #
  # Code entry and email links: a flow (sign-up, password reset, email
  # change) sends one email with a 6-digit code and a link
  # `https://tarkk.ir/v/<register|reset|email>#<linkToken>`. The app keeps
  # the flowId from the start call in secure storage and verifies with
  # either the code the person typed or the linkToken from the link, always
  # together with that flowId. A link opened on another phone therefore
  # cannot finish someone else's flow; the person types the code instead.

  /auth/register:
    post:
      operationId: register
      tags: [Sign-up and sign-in]
      summary: Start email + password sign-up.
      description: |
        Always 202 with the same shape. A new address gets a code; an
        address that already has an account gets an email saying so, and
        its flowId never verifies. The name is the one the person typed, or
        the one the app already has locally.
      security: []
      parameters:
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/OptionalInstallKey'
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          $ref: '#/components/responses/FlowStarted'
        '400':
          $ref: '#/components/responses/Problem'
        '422':
          description: Password refused (`password_too_short`, `password_too_long`, `password_too_common`, `password_matches_email`, `password_invalid`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /auth/register/resend:
    post:
      operationId: resendRegistrationCode
      tags: [Sign-up and sign-in]
      summary: Send a new code and link. The previous code stops working.
      description: Allowed once per `resendAvailableAt`, at most 4 times per flow (then `resend_limit`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowRef'
      responses:
        '202':
          $ref: '#/components/responses/FlowStarted'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /auth/register/verify:
    post:
      operationId: verifyRegistration
      tags: [Sign-up and sign-in]
      summary: Verify the code or link; creates the account and signs in.
      description: |
        The app calls this as soon as the last digit is typed, or as soon
        as the link opens the app. Success signs the app in directly.

        Failures: `code_invalid` (422, with `attemptsLeft`), `code_locked`
        (423, after 5 wrong codes; resend for a new one), `flow_expired`
        (410), `flow_not_found` (404), `email_already_registered` (409, the
        address got an account meanwhile; sign in instead).

        Repeating a successful verify within 10 minutes (the answer got
        lost) signs in again instead of failing.
      security: []
      parameters:
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/OptionalInstallKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofRequest'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '423':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /auth/login:
    post:
      operationId: login
      tags: [Sign-up and sign-in]
      summary: Sign in with email and password.
      description: |
        Every failure is 401 `invalid_credentials`, whatever the reason.
        After 5 failures from one IP for one address (or 20 from anywhere
        in an hour), 429 until the window passes. 403 `account_disabled`
        only after a correct password.
      security: []
      parameters:
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/OptionalInstallKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /auth/google/nonce:
    post:
      operationId: googleNonce
      tags: [Sign-up and sign-in]
      summary: A one-time nonce to pass to the Google SDK before sign-in.
      description: |
        Google copies it into the ID token. The server accepts each nonce
        once and only for 10 minutes, so an ID token captured elsewhere or
        replayed is refused.
      security: []
      responses:
        '200':
          description: The nonce.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleNonce'
        '429':
          $ref: '#/components/responses/Problem'

  /auth/google:
    post:
      operationId: googleSignIn
      tags: [Sign-up and sign-in]
      summary: Sign in or sign up with a Google ID token.
      description: |
        The server verifies the ID token itself (signature against Google's
        keys, issuer, audience, expiry, verified email, nonce) and takes the
        email and Google account id only from it.

        - Known Google account: 200, signed in.
        - The address already has a password account: 409 `link_required`
          with `ticket`, `ticketExpiresAt` and a masked `email`. Ask for that
          account's password and call /auth/google/link.
        - New address: account created with `name` from the request (the
          name the app already has locally) or, if absent, Google's name.
          If neither exists, 422 `name_required` with `ticket` and maybe
          `suggestedName`; ask for a name and call /auth/google/complete.

        Other failures: 401 `google_token_invalid` (get a fresh token),
        422 `google_email_unverified`, 409 `account_conflict` (the address
        is on an account linked to a different Google account),
        409 `retry_sign_in` (a race; sign in with Google again),
        503 `google_unavailable` (Google's keys could not be fetched).
      security: []
      parameters:
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/OptionalInstallKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          description: '`link_required`, `account_conflict` or `retry_sign_in`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GoogleTicketProblem'
        '422':
          description: '`name_required` or `google_email_unverified`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GoogleTicketProblem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /auth/google/link:
    post:
      operationId: linkGoogle
      tags: [Sign-up and sign-in]
      summary: Link Google to an existing password account, after its password.
      description: |
        Wrong password: 401 `invalid_credentials` with `attemptsLeft`. The
        ticket allows 5 tries (then 423 `ticket_locked`) and shares the login
        failure limits. 410 `ticket_expired`: sign in with Google again.
        Success signs in and emails the account that Google was added.
      security: []
      parameters:
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/OptionalInstallKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLinkRequest'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '423':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /auth/google/complete:
    post:
      operationId: completeGoogleSignup
      tags: [Sign-up and sign-in]
      summary: Finish a Google sign-up that needed a name.
      security: []
      parameters:
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/OptionalInstallKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleCompleteRequest'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /auth/token/refresh:
    post:
      operationId: refreshTokens
      tags: [Sessions]
      summary: Swap a refresh token for a new pair.
      description: |
        Refresh tokens rotate: each works once. Repeating the same refresh
        within 60 seconds (the answer got lost) works and invalidates the
        pair that was never received. Any other reuse is treated as theft
        and ends the session: 401 `session_ended`, sign in again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /auth/logout:
    post:
      operationId: logout
      tags: [Sessions]
      summary: End this session. Its access token stops working at once.
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Problem'

  /auth/logout-all:
    post:
      operationId: logoutAll
      tags: [Sessions]
      summary: End every session of the account, this one included.
      responses:
        '204':
          description: Signed out everywhere.
        '401':
          $ref: '#/components/responses/Problem'

  /auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [Password]
      summary: Start a password reset. Same answer for every address.
      description: Only an address with an account receives a code; others receive nothing.
      security: []
      parameters:
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotRequest'
      responses:
        '202':
          $ref: '#/components/responses/FlowStarted'
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /auth/password/forgot/resend:
    post:
      operationId: resendResetCode
      tags: [Password]
      summary: Send a new reset code and link.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowRef'
      responses:
        '202':
          $ref: '#/components/responses/FlowStarted'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /auth/password/forgot/verify:
    post:
      operationId: verifyReset
      tags: [Password]
      summary: Verify the reset code or link; returns a ticket for the new password.
      description: Same failures as /auth/register/verify. Verifying again replaces the ticket.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofRequest'
      responses:
        '200':
          description: The ticket for /auth/password/reset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetTicket'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '423':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /auth/password/reset:
    post:
      operationId: resetPassword
      tags: [Password]
      summary: Set the new password and sign in. Every other session ends.
      description: |
        A Google-only account gains a password this way. The account's
        email is told the password changed. 410 `ticket_expired` when the
        ticket is used, old or unknown. 422 with a `password_*` code when
        the password is refused.
      security: []
      parameters:
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/OptionalInstallKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetRequest'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '410':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /auth/password/change:
    post:
      operationId: changePassword
      tags: [Password]
      summary: Change the password, given the current one.
      description: |
        This session stays signed in; every other session ends. 401
        `invalid_credentials` for a wrong current password. 409
        `password_not_set` for a Google-only account (use forgot password
        to add one). 422 with a `password_*` code or `password_unchanged`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Changed.
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /auth/email-change:
    post:
      operationId: startEmailChange
      tags: [Email change]
      summary: Start changing the account's email (not offered by the app yet).
      description: |
        Needs fresh proof: the current password, or for a Google-only
        account a fresh Google ID token of the linked Google account. A code
        and link go to the new address; nothing changes until it is
        verified.
      x-app-status: not used by the app yet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
      responses:
        '202':
          $ref: '#/components/responses/FlowStarted'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /auth/email-change/resend:
    post:
      operationId: resendEmailChangeCode
      tags: [Email change]
      summary: Send a new code to the new address.
      x-app-status: not used by the app yet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowRef'
      responses:
        '202':
          $ref: '#/components/responses/FlowStarted'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /auth/email-change/verify:
    post:
      operationId: confirmEmailChange
      tags: [Email change]
      summary: Verify the new address; it becomes the account's email.
      description: |
        The old address is told; every other session ends. 409
        `email_in_use` when the address belongs to another account.
      x-app-status: not used by the app yet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofRequest'
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '423':
          $ref: '#/components/responses/Problem'

  # ---- Profile -------------------------------------------------------------

  /profile:
    get:
      operationId: getProfile
      tags: [Profile]
      summary: The signed-in account's profile.
      responses:
        '200':
          description: The profile. The ETag header is its version, for If-Match on PUT.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Problem'
    put:
      operationId: putProfile
      tags: [Profile]
      summary: Replace the editable profile fields.
      description: |
        Editable: name and avatarId. Email is read-only here; any other
        field in the body is ignored. With If-Match, a write based on a
        stale copy (another device changed the profile) is refused with
        412 `profile_changed` instead of silently undoing that change.
        Sending the current values again always succeeds, so retries are
        safe.
      parameters:
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: The updated profile.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /account/delete:
    post:
      operationId: deleteAccount
      tags: [Account]
      summary: Delete the account and its data, at once and for good.
      description: |
        A "yes" is not enough. The request needs all of:
        - `confirmEmail`: the account's email, typed by the person (case
          and surrounding spaces do not matter). Anything else is 422
          `confirmation_mismatch`.
        - fresh proof: `currentPassword`, or for a Google-only account a
          new `googleIdToken` of the linked Google account (get a nonce
          first). Wrong proof is 401 `invalid_credentials`.
        - while a paid Bazaar period is running, `subscriptionAcknowledged:
          true`. Without it the answer is 409 `subscription_active` with
          `autoRenewing`, so the app can say that deleting the account does
          not cancel the Bazaar subscription.

        On success every session ends, a confirmation email goes to the
        address, and the email can be used for a new account. Bazaar
        purchases are removed with the account, so the same purchase can
        be restored in a new account later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '204':
          description: Deleted. The tokens this app holds no longer work.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  # ---- Subscription --------------------------------------------------------

  /subscription:
    get:
      operationId: getSubscription
      tags: [Subscription]
      summary: Current subscription state as a signed entitlement.
      description: |
        Returns the caller's subscription as the server knows it right now,
        re-checking Cafe Bazaar first when the stored state is stale.

        A Bazaar outage or timeout never downgrades anyone: the server answers
        with the last state it verified and sets `bazaarChecked: false`.
      parameters:
        - $ref: '#/components/parameters/InstallKey'
      responses:
        '200':
          description: The caller's subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /subscription/plans:
    get:
      operationId: getPlans
      tags: [Subscription]
      summary: The plans on sale, in display order.
      description: |
        Public, so the paywall can list plans before sign-in. The list comes
        from the server's TARK_BAZAAR_SKUS, so plans are added, removed or
        reordered without an app update. Prices are not here: the app asks
        Bazaar for each plan's price, because Bazaar is what charges.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The plans on sale.
          content:
            application/json:
              schema:
                type: object
                required: [plans]
                properties:
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plan'

  /subscription/bazaar/purchases:
    post:
      operationId: submitBazaarPurchase
      tags: [Subscription]
      summary: Hand a Cafe Bazaar purchase to the server for verification.
      description: |
        Called right after a purchase and on "restore". The server verifies
        the token with Bazaar's developer API; nothing the app sends about
        dates or state is trusted.

        A purchase token belongs to exactly one account. Submitting a token
        already bound to another account answers 409 `purchase_owned_elsewhere`.
        Submitting the same token again for the same account is harmless and
        returns the current state.
      parameters:
        - $ref: '#/components/parameters/InstallKey'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BazaarPurchaseRequest'
      responses:
        '200':
          description: Verified; the entitlement reflects it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          description: '`bazaar_unavailable` (Bazaar could not be reached) or `purchase_not_found_yet` (Bazaar does not show a fresh purchase yet). Retry later with the same Idempotency-Key.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      description: Short-lived access token from the sign-in endpoints.

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Language of people-facing text in the response (en or fa). Accepted by every endpoint.
      schema:
        type: string
        examples: [fa-IR, en]
    Platform:
      name: X-Tark-Platform
      in: header
      required: false
      description: The platform signing in. Sign-in exists on Android and iOS only.
      schema:
        type: string
        enum: [android, ios]
    OptionalInstallKey:
      name: X-Tark-Install-Key
      in: header
      required: false
      description: The install's public key (as for /subscription), stored on the new session.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: When given, a retry with the same key and body replays the first answer instead of sending a second email.
      schema:
        type: string
        format: uuid
    InstallKey:
      name: X-Tark-Install-Key
      in: header
      required: true
      description: |
        The install's Ed25519 public key, base64url without padding (32 bytes).
        The entitlement is bound to it, so a copied entitlement does not
        verify on another phone.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid

  responses:
    FlowStarted:
      description: A flow started (or a code was resent). Looks the same whether or not the address has an account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FlowStarted'
    Session:
      description: Signed in. Carries the tokens and the profile, so the app can show the signed-in state at once.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Session'
    Problem:
      description: A failure, in the one shape every endpoint uses.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ---- Accounts and profile ----------------------------------------------

    Email:
      type: string
      maxLength: 254
      description: Plain ASCII address. Compared case-insensitively.
    Name:
      type: string
      minLength: 1
      maxLength: 50
      description: |
        Display name, 1-50 characters after trimming. Shown to others in a
        room, so control, bidi-override and other invisible formatting
        characters are refused (ZWNJ and ZWJ are allowed).
    Password:
      type: string
      minLength: 8
      maxLength: 128
      description: 8-128 characters. Very common passwords and the email itself are refused.
    Locale:
      type: string
      enum: [en, fa]
      description: Language of the emails this call sends. Defaults to Accept-Language, then English.

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        name:
          $ref: '#/components/schemas/Name'
        locale:
          $ref: '#/components/schemas/Locale'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string

    ForgotRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        locale:
          $ref: '#/components/schemas/Locale'

    CodeSpec:
      type: object
      description: The shape of the code, so the app shows the right keyboard and boxes.
      required: [length, alphabet]
      properties:
        length:
          type: integer
          const: 6
        alphabet:
          type: string
          const: digits
          description: ASCII digits 0-9 only. Use a numeric keypad and one-time-code autofill.

    FlowStarted:
      type: object
      required: [flowId, expiresAt, resendAvailableAt, code]
      properties:
        flowId:
          type: string
          description: |
            Secret handle for this flow. Keep it in secure storage until the
            flow ends: a deep link needs it to finish the flow when the app
            was closed or in the background.
        expiresAt:
          type: integer
          format: int64
          description: The code, link and flow stop working at this time (15 minutes after the last send).
        resendAvailableAt:
          type: integer
          format: int64
        code:
          $ref: '#/components/schemas/CodeSpec'

    FlowRef:
      type: object
      required: [flowId]
      properties:
        flowId:
          type: string

    ProofRequest:
      type: object
      required: [flowId]
      description: Exactly one of code or linkToken.
      properties:
        flowId:
          type: string
        code:
          type: string
          pattern: '^[0-9]{6}$'
        linkToken:
          type: string
          description: The part after `#` in the email link.

    ResetTicket:
      type: object
      required: [resetTicket, expiresAt]
      properties:
        resetTicket:
          type: string
        expiresAt:
          type: integer
          format: int64

    ResetRequest:
      type: object
      required: [resetTicket, newPassword]
      properties:
        resetTicket:
          type: string
        newPassword:
          $ref: '#/components/schemas/Password'

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          $ref: '#/components/schemas/Password'

    EmailChangeRequest:
      type: object
      required: [newEmail]
      properties:
        newEmail:
          $ref: '#/components/schemas/Email'
        currentPassword:
          type: string
          description: Required when the account has a password.
        googleIdToken:
          type: string
          description: Required for a Google-only account; a fresh ID token of the linked Google account.
        locale:
          $ref: '#/components/schemas/Locale'

    DeleteAccountRequest:
      type: object
      required: [confirmEmail]
      properties:
        confirmEmail:
          type: string
          description: The account's email, typed out by the person.
        currentPassword:
          type: string
          description: Required when the account has a password.
        googleIdToken:
          type: string
          description: Required for a Google-only account; a fresh ID token of the linked Google account.
        subscriptionAcknowledged:
          type: boolean
          default: false
          description: Required (true) while a paid Bazaar period is running.
        locale:
          $ref: '#/components/schemas/Locale'

    GoogleNonce:
      type: object
      required: [nonce, expiresAt]
      properties:
        nonce:
          type: string
        expiresAt:
          type: integer
          format: int64

    GoogleSignInRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          maxLength: 8192
        name:
          $ref: '#/components/schemas/Name'
        locale:
          $ref: '#/components/schemas/Locale'

    GoogleTicketProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            ticket:
              type: string
              description: Continue with /auth/google/link (link_required) or /auth/google/complete (name_required). Valid 10 minutes, once.
            ticketExpiresAt:
              type: integer
              format: int64
            email:
              type: string
              description: link_required only. The address, masked (pe•••@gmail.com).
            suggestedName:
              type: string
              description: name_required only, when Google had a usable name.

    GoogleLinkRequest:
      type: object
      required: [ticket, password]
      properties:
        ticket:
          type: string
        password:
          type: string
        locale:
          $ref: '#/components/schemas/Locale'

    GoogleCompleteRequest:
      type: object
      required: [ticket, name]
      properties:
        ticket:
          type: string
        name:
          $ref: '#/components/schemas/Name'

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    Tokens:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        accessToken:
          type: string
          description: "Opaque. Send as `Authorization: Bearer <token>`. Lives 15 minutes."
        accessTokenExpiresAt:
          type: integer
          format: int64
        refreshToken:
          type: string
          description: Opaque. Keep in secure storage. Works once; see /auth/token/refresh.
        refreshTokenExpiresAt:
          type: integer
          format: int64
          description: Unused for this long (180 days), the session ends.

    Session:
      allOf:
        - $ref: '#/components/schemas/Tokens'
        - type: object
          required: [newAccount, profile]
          properties:
            newAccount:
              type: boolean
              description: This call created the account.
            profile:
              $ref: '#/components/schemas/Profile'

    Profile:
      type: object
      required: [id, name, avatarId, email, signInMethods, createdAt, updatedAt]
      description: New fields are only ever added, never renamed or removed; ignore unknown ones.
      properties:
        id:
          type: string
          format: uuid
          description: Account id; the same value as `sub` in the entitlement.
        name:
          $ref: '#/components/schemas/Name'
        avatarId:
          type: [string, 'null']
          pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
          description: |
            One of the app's predefined avatars, or null when none was
            chosen. The server does not keep the list; an app that does not
            know an id shows its fallback avatar.
        email:
          type: string
          description: Read-only. Changes only through the email-change flow.
        signInMethods:
          type: array
          items:
            type: string
            enum: [google, password]
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64

    ProfileUpdate:
      type: object
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        avatarId:
          type: [string, 'null']
          pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
          description: Omitted or null clears the avatar.

    # ---- Subscription ------------------------------------------------------

    Problem:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Stable machine-readable failure code.
          examples: [unauthorized, rate_limited, invalid_request, invalid_credentials, code_invalid, link_required, session_ended, purchase_owned_elsewhere, purchase_invalid]
        message:
          type: string
          description: |
            One sentence for people, in the request's language. Present on
            every Problem. The app may show its own wording for codes it
            knows and this message for any other.
        detail:
          type: string
          description: Developer-facing explanation. Never shown to people.
        retryAfterMs:
          type: integer
          format: int64

    BazaarPurchaseRequest:
      type: object
      required: [sku, purchaseToken]
      properties:
        sku:
          type: string
          pattern: '^(tark_premium_[1-9][0-9]?m|TEST_SUB)$'
          description: |
            A plan id. Any plan id is accepted, not only those on sale, so a
            plan taken off sale still restores and renews. The exception is
            TEST_SUB, the 5-minute test product, which is accepted only by a
            server whose TARK_BAZAAR_SKUS lists it.
        purchaseToken:
          type: string
          minLength: 1
          maxLength: 512

    SubscriptionResponse:
      type: object
      required: [entitlement, bazaarChecked]
      properties:
        entitlement:
          type: string
          description: |
            The signed entitlement token (see EntitlementPayload). The app
            stores this string as-is and verifies it offline; it never
            stores the decoded fields separately.
        bazaarChecked:
          type: boolean
          description: False when Bazaar could not be reached and the answer is the last verified state.
        planTitle:
          type: [string, 'null']
          description: |
            The entitlement's plan named in the request's language ("Tark
            Premium, 3 months", or "Gift from Tark" for premium given by
            support).
            Display only; null when there is no plan.

    Plan:
      type: object
      required: [sku, months, days, title]
      properties:
        sku:
          type: string
          examples: [tark_premium_3m]
        months:
          type: integer
          description: Period length in months; 0 for the test plan.
        days:
          type: integer
          description: Period length as the Bazaar panel names it (30 days a month, 365 a year); 0 for the test plan.
        minutes:
          type: integer
          description: Only on the 5-minute test plan (sku TEST_SUB), which test servers list.
        title:
          type: string
          description: The plan's name in the request's language, e.g. "Tark Premium, 3 months" / "اشتراک سه ماهه تَرک".

    EntitlementPayload:
      type: object
      description: |
        The body of the signed entitlement token.

        Wire format: `v1.<kid>.<payload>.<signature>` where `payload` is the
        base64url (no padding) UTF-8 JSON of this object and `signature` is
        the base64url Ed25519 signature over the ASCII bytes of
        `v1.<kid>.<payload>`. `kid` names the server signing key, so keys
        can be rotated while older app builds still carry the previous one.
      required: [sub, ik, st, iat, sus, pol]
      properties:
        sub:
          type: string
          description: Account id.
        ik:
          type: string
          description: The install public key this entitlement is bound to (base64url).
        st:
          type: string
          enum: [none, active, expired, refunded]
          description: |
            none: never subscribed. active: paid period running (auto-renew
            may be on or off; turning it off is not suspicious).
            expired: the paid period ended normally. refunded: the purchase
            was refunded or revoked before its paid period ended.
        sku:
          type: [string, 'null']
        until:
          type: [integer, 'null']
          format: int64
          description: |
            When access ends or ended: the end of the current or last paid
            period, or for `refunded` the moment the refund took effect.
        ar:
          type: boolean
          description: Auto-renew is on.
        sus:
          type: boolean
          description: |
            The account is in the conservative check mode after a refund
            before expiry. Decided by the server and cleared by it after a
            clean paid period.
        iat:
          type: integer
          format: int64
          description: Server time this token was issued. Also the last successful verification time.
        pol:
          $ref: '#/components/schemas/EntitlementPolicy'

    EntitlementPolicy:
      type: object
      description: Offline policy numbers, sent by the server so they can change without an app release.
      required: [graceH, refreshD, susOfflineH]
      properties:
        graceH:
          type: integer
          minimum: 0
          maximum: 336
          description: Hours an auto-renewing subscription stays usable offline after `until`.
        refreshD:
          type: integer
          minimum: 0
          maximum: 30
          description: Days before `until` in which the app refreshes quietly whenever it is online.
        susOfflineH:
          type: integer
          minimum: 1
          maximum: 720
          description: For accounts in the conservative mode, hours since `iat` after which a check is required.
