{{define "title"}}{{t "nav.users"}} · {{t "brand"}}{{end}}
{{define "main"}}
<h1>{{t "users.h"}}</h1>
<p>{{t "users.lead"}}</p>
<form method="get" action="/users" class="row">
  <input name="q" value="{{.Q}}" placeholder="email@example.com" required maxlength="254" autofocus dir="ltr">
  <button>{{t "btn.find"}}</button>
</form>
{{if .NotFound}}<p class="error">{{t "users.notFound"}}</p>{{end}}
{{end}}
