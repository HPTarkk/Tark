{{define "title"}}{{t "nav.users"}} · {{t "brand"}}{{end}}
{{define "main"}}
<section class="search-hero">
  <span class="hero-icon">{{icon "users"}}</span>
  <h1>{{t "users.h"}}</h1>
  <p class="lead">{{t "users.lead"}}</p>
  <form method="get" action="/users" class="search">
    {{icon "search"}}
    <input name="q" value="{{.Q}}" placeholder="email@example.com" required maxlength="254" autofocus dir="ltr" aria-label="{{t "users.h"}}">
    <button>{{t "btn.find"}}</button>
  </form>
  {{if .NotFound}}<div class="flash bad" role="alert">{{icon "alert"}}<p>{{t "users.notFound"}}</p></div>{{end}}
</section>
{{end}}
