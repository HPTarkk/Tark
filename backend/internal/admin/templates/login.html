{{define "title"}}{{t "login.title"}} · {{t "brand"}}{{end}}
{{define "main"}}
<section class="auth">
<div class="auth-card">
<div class="auth-mark" aria-hidden="true"><img src="/static/logo.png" alt="" width="64" height="64"></div>
<h1>{{t "brand"}}</h1>
<p class="auth-lead">{{t "login.lead"}}</p>
{{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}
<form method="post" action="/login" class="stack">
  <input type="hidden" name="pre" value="{{.Pre}}">
  <label>{{t "label.email"}} <input type="email" name="email" autocomplete="username" required maxlength="254" autofocus dir="ltr"></label>
  <label>{{t "label.password"}} <input type="password" name="password" autocomplete="current-password" required maxlength="1024" dir="ltr"></label>
  <button>{{t "btn.continue"}}</button>
</form>
</div>
</section>
{{end}}
