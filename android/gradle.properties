org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Stays false while any plugin still applies kotlin-android unconditionally:
# AGP's built-in Kotlin and an applied kotlin-android cannot share a module.
# As of November 2026 the only one left is bluetooth_low_energy_android 6.2.1
# (latest); every other plugin, including the vendored audio_io and rnnoise,
# switches on this flag. Plugins that rely on built-in Kotlin get
# kotlin-android applied by Flutter's Gradle plugin while this is false.
# Turning it on also means dropping kotlin-android from app/build.gradle.kts.

# Kotlin incremental compilation fails on Windows ("Could not close
# incremental caches ... Storage for [...] is already registered"): the IC
# storages stay registered in the reused compiler JVM, so the next compilation
# cannot reopen them. First seen on the Gradle 9 / AGP 9 / KGP 2.4 bump; it
# reproduces on a wiped build dir with no daemons alive, and Kotlin 2.4.0
# removed the narrower `out-of-process` workaround. PR #360 dropped this line
# to retest on KGP 2.4.21: Linux CI built fine, but `flutter run --release` on
# Windows failed in every Kotlin plugin module again, so it is back. The cost
# is small (one app module plus plugins that go UP-TO-DATE after the first
# build). Retest on Windows, not just CI, before dropping it.
kotlin.incremental=false
