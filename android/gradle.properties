org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Since the Gradle 9 / AGP 9 / KGP 2.4 bump every Kotlin module dies with
# "Could not close incremental caches ... Storage for [...] is already
# registered": the IC storages stay registered in the reused compiler JVM, so
# the next compilation cannot reopen them. Reproduces on a wiped build dir with
# no daemons alive, on both KGP 2.3.20 and 2.4.10, and `in-process` fails the
# same way. `out-of-process` was the narrower fix — it keeps IC and only pays a
# JVM start-up — but Kotlin 2.4.0 removed that strategy outright, so turning IC
# off is what is left. Kotlin here is one app module plus plugins that go
# UP-TO-DATE after the first build, so the cost is small. Drop this line and
# retest on the next KGP; it is a workaround, not a preference.
kotlin.incremental=false
