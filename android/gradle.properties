org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Stays false while any plugin still applies kotlin-android unconditionally:
# AGP's built-in Kotlin and an applied kotlin-android cannot share a module.
# As of November 2026 the only one left is bluetooth_low_energy_android 6.2.1
# (latest); every other plugin, including the vendored audio_io and rnnoise,
# switches on this flag. Plugins that rely on built-in Kotlin get
# kotlin-android applied by Flutter's Gradle plugin while this is false.
# Turning it on also means dropping kotlin-android from app/build.gradle.kts.

# Kotlin incremental compilation stays off. With it on, every plugin's
# compile*Kotlin dies with "Could not close incremental caches in
# build\<plugin>\kotlin\...\caches-jvm": first seen on the Gradle 9 / AGP 9 /
# KGP 2.4 bump (2.3.20 and 2.4.10, wiped build dir, no daemons alive,
# `in-process` too; `out-of-process` was removed in Kotlin 2.4.0). #360 dropped
# this line to retest on KGP 2.4.21 and `flutter run --release` failed in all
# ten Kotlin plugin modules on Windows, so it is back. Kotlin here is one app
# module plus plugins that go UP-TO-DATE after the first build, so the cost is
# small. Retest on the next KGP *on Windows* (project on D:, pub cache on C:)
# before removing it again; a green Linux CI build is not evidence.
kotlin.incremental=false
