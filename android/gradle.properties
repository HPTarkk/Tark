org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Stays false while any plugin still applies kotlin-android unconditionally:
# AGP's built-in Kotlin and an applied kotlin-android cannot share a module.
# As of November 2026 the only one left is bluetooth_low_energy_android 6.2.1
# (latest); every other plugin, including the vendored audio_io and rnnoise,
# switches on this flag. Plugins that rely on built-in Kotlin get
# kotlin-android applied by Flutter's Gradle plugin while this is false.
# Turning it on also means dropping kotlin-android from app/build.gradle.kts.
